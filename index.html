<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Repository</title>

    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 70%);
            color: #e0e0ff;
            text-align: center;
        }

        .hero {
            padding: 140px 20px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 
                0 0 15px #00ffff,
                0 0 25px #ff00ff,
                0 0 40px #00ffff;
        }

        p {
            font-size: 1.3rem;
            max-width: 600px;
            margin: 0 auto 40px;
            color: #ccccff;
            text-shadow: 0 0 10px #000;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin: 10px;
            border-radius: 50px;
            font-size: 1.2rem;
            text-decoration: none;
            color: #ffffff;
            border: 2px solid #00ffff;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0,255,255,0.4);
        }

        .btn:hover {
            background: #00ffff;
            color: #000000;
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Rave Repository</h1>
        <p>Step into the cosmic underground — mixes, flyers, gear and rave culture from the neon night.</p>

        <a href="rave-radio.html" class="btn">Listen Now</a>
        <a href="#" class="btn">Explore the Repository</a>
    </div>

</body>
</html>
