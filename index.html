<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Repository</title>

    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00);
            background-size: 400% 400%;
            animation: raveGradient 12s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes raveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero {
            padding: 120px 20px;
            text-shadow: 0 0 20px #000;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 25px #ff00ff, 0 0 40px #00ffff;
        }

        p {
            font-size: 1.3rem;
            max-width: 600px;
            margin: 0 auto 40px;
            text-shadow: 0 0 10px #000;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin: 10px;
            border-radius: 50px;
            font-size: 1.2rem;
            text-decoration: none;
            color: white;
            border: 2px solid white;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

        .btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 30px #fff;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Rave Repository</h1>
        <p>The ultimate gateway into rave culture, mixes, flyers, gear and the cosmic neon universe.</p>

        <a href="rave-radio.html" class="btn">Listen Now</a>
        <a href="#" class="btn">Explore the Repository</a>
    </div>

</body>
</html>
