<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Repository</title>

    <style>

      /* Tagline */
.rave-tagline {
  text-align: center;
  margin-top: 10px;
}

.rave-tagline p {
  font-size: 1.4rem;
  color: #ccccff;
  text-shadow: 0 0 15px #00ffff;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* Navigation Bar */
.rave-nav {
  text-align: center;
  margin-bottom: 40px;
}

.rave-nav a {
  color: #ffffff;
  text-decoration: none;
  margin: 0 15px;
  font-size: 1.1rem;
  font-family: 'Orbitron', sans-serif;
  padding: 8px 15px;
  border-radius: 8px;
  transition: 0.3s;
  border: 1px solid transparent;
}

.rave-nav a:hover {
  border-color: #00ffff;
  color: #00ffff;
  text-shadow: 0 0 10px #00ffff;
}

        /* Logo */
.rave-header {
  text-align: center;
  margin-top: 40px;
}

.rave-logo {
  width: 80%;
  max-width: 600px;
  filter: drop-shadow(0 0 25px #00ffff)
          drop-shadow(0 0 40px #ff00ff);
  animation: pulseGlow 6s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%   { filter: drop-shadow(0 0 20px #00ffff)
                 drop-shadow(0 0 30px #ff00ff); }
  50%  { filter: drop-shadow(0 0 40px #00ffff)
                 drop-shadow(0 0 60px #ff00ff); }
  100% { filter: drop-shadow(0 0 20px #00ffff)
                 drop-shadow(0 0 30px #ff00ff); }
}

    </style>
</head>

<body>
  <header class="rave-header">
    <div class="rave-tagline">
  <p>Step into the cosmic underground</p>
</div>

<nav class="rave-nav">

  <a href="#">Flyer Gallery</a>
  <a href="#">Gear & Tech</a>
  <a href="#">Culture</a>
</nav>

  <img src="rave repository logo.png" alt="Rave Repository Logo" class="rave-logo">
</header>

        <a href="#" class="btn">Explore the Repository</a>
    </div>

</body>
</html>
